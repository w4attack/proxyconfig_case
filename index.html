<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PROXY HUB // Network Tunnel</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #020609;
            --panel: #061018;
            --border: #0369a1;
            --text: #f0f9ff;
            --muted: #38bdf8;
            --accent: #06b6d4; /* Уникальный циановый акцент */
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: var(--bg); color: var(--text); font-family: 'JetBrains Mono', monospace; padding: 2rem; min-height: 100vh; display: flex; flex-direction: column; justify-content: space-between; }
        
        header { display: flex; justify-content: space-between; border-bottom: 2px solid var(--border); padding-bottom: 1rem; font-size: 0.85rem; color: var(--muted); }
        header span { color: var(--accent); }

        .layout { display: grid; grid-template-columns: 350px 1fr; gap: 2rem; margin: 3rem 0; align-items: stretch; }
        
        .left-panel { background: var(--panel); border: 1px solid var(--border); padding: 2rem; display: flex; flex-direction: column; justify-content: space-between; }
        .left-panel h1 { font-size: 1.5rem; margin-bottom: 1rem; line-height: 1.2; text-transform: uppercase; }
        .left-panel p { font-size: 0.85rem; color: #94a3b8; margin-bottom: 2rem; }

        .btn { background: transparent; color: var(--accent); border: 1px solid var(--accent); padding: 1rem; font-family: inherit; font-weight: bold; font-size: 0.85rem; text-transform: uppercase; cursor: pointer; transition: all 0.2s; }
        .btn:hover { background: var(--accent); color: #000; }

        .nodes-container { display: flex; flex-direction: column; gap: 1rem; }
        .node-box { background: var(--panel); border: 1px solid var(--border); padding: 1.5rem; display: flex; justify-content: space-between; align-items: center; cursor: pointer; transition: border-color 0.2s; }
        .node-box:hover { border-color: var(--accent); }
        .status { color: var(--accent); font-weight: bold; }

        footer { display: flex; justify-content: space-between; border-top: 1px solid var(--border); padding-top: 1rem; font-size: 0.75rem; color: var(--muted); }
        a { color: var(--muted); text-decoration: none; }
        a:hover { color: var(--text); }

        .toast { position: fixed; bottom: 2rem; right: 2rem; background: var(--panel); border: 1px solid var(--accent); color: var(--text); padding: 1rem 1.5rem; font-size: 0.85rem; opacity: 0; transform: translateY(20px); transition: all 0.3s; pointer-events: none; z-index: 10; }
        .toast.show { opacity: 1; transform: translateY(0); }

        @media(max-width: 800px) { .layout { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <header>
        <div>TUNNEL MODE: INVIZIBLE PRO</div>
        <div>SECURE: <span>ENABLED</span></div>
    </header>
    <div class="layout">
        <div class="left-panel">
            <div>
                <h1>Конфигуратор прокси</h1>
                <p>Управление защищенными туннелями, DNSCrypt и маршрутизацией трафика.</p>
            </div>
            <button class="btn" onclick="showToast('Все сетевые туннели переподключены')">Переподключить</button>
        </div>
        <div class="nodes-container">
            <div class="node-box" onclick="showToast('Узел Tor: цепь построена успешно')">
                <span>TOR RELAY [PORT 9050]</span>
                <span class="status">CONNECTED</span>
            </div>
            <div class="node-box" onclick="showToast('DNSCrypt: шифрование запросов активно')">
                <span>DNSCRYPT [PORT 5353]</span>
                <span class="status">SECURE</span>
            </div>
        </div>
    </div>
    <footer>
        <div>wA Studio // Security Lab</div>
        <a href="https://w4attack.github.io/port/" target="_blank">w3bAttacking © 2026 // wA Studio</a>
    </footer>
    <div id="toast" class="toast"></div>
    <script>
        function showToast(text) {
            const t = document.getElementById('toast');
            t.textContent = text;
            t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 3000);
        }
    </script>
</body>
</html>
